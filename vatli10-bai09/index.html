.note{text-align:center; color:#9C92C4; font-style:italic; font-size:1rem; margin:10px 0 0;}

/* nút + phản hồi */
.actions{text-align:center; margin-top:16px;}
.btn{border:none; cursor:pointer; font-weight:800; border-radius:18px; padding:14px 34px; font-size:1.25rem; margin:6px; transition:transform .1s;}
.btn:active{transform:scale(.95);}
.btn-main{background:linear-gradient(135deg,var(--acc1),var(--acc2)); color:#fff; box-shadow:0 6px 0 var(--accdark);}
.btn-next{background:linear-gradient(135deg,#3ED598,#1FB463); color:#fff; box-shadow:0 6px 0 #17915c;}
.btn-end{background:linear-gradient(135deg,#FF8DA1,#FF5A6E); color:#fff; box-shadow:0 6px 0 #d63a4d;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.fb{max-width:860px; margin:14px auto 0; font-size:1.3rem; font-weight:800; padding:12px 18px; border-radius:16px; text-align:center;}
.fb.ok{background:#E4FBF0; color:#159a5f;} .fb.bad{background:#FFECEF; color:#e0384b;} .fb.info{background:#EAF3FF; color:#2560d0;}
.hint{max-width:860px; margin:12px auto 0; font-size:1.2rem; font-weight:600; padding:12px 18px; border-radius:16px; background:#FFF6DB; border:2px dashed #F5C95A; color:#7a5c00; text-align:center;}
.hint b{color:#B8791B;}
.explain{max-width:860px; margin:12px auto 0; font-size:1.2rem; font-weight:600; line-height:1.5; padding:14px 20px; border-radius:16px; background:#FFFBEA; border:2px solid #FFE7A6; color:#6b4e00; text-align:center;}
.anskey{margin-top:6px; font-weight:800; color:#159a5f;}

/* mở đầu + kết quả */
.intro{text-align:center;}
.intro h2{font-size:1.9rem; margin:4px 0; color:var(--acc1);}
.intro .sub{font-weight:700; color:var(--pink); margin-bottom:16px;}
.guide ul{margin:8px 0 0; padding-left:24px;}
.guide li{margin-bottom:6px;}
.guide li:last-child{margin-bottom:0;}
.guide{max-width:840px; margin:0 auto 18px; text-align:left; font-size:1.15rem; line-height:1.6; background:#FFFBEA; border:2px solid #FFE7A6; border-radius:18px; padding:16px 22px; color:#6b4e00;}
.fields{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:8px;}
.fields label{display:flex; flex-direction:column; text-align:left; font-weight:800; color:#9C92C4; font-size:.95rem; gap:4px;}
.fields input{font:inherit; font-size:1.2rem; font-weight:700; padding:10px 14px; border-radius:14px; border:3px solid var(--line); min-width:260px; color:var(--ink);}
.fields input:focus{outline:none; border-color:var(--acc1);}
.res-top{text-align:center;}
.res-top img{width:150px; display:block; margin:0 auto;}
.big-stars{font-size:4.6rem; letter-spacing:14px; color:#FFB03A; line-height:1.1; margin:4px 0;}
.star-label{font-size:1.9rem; font-weight:800; color:var(--orange); margin-bottom:6px;}
.big{font-size:4.6rem; font-weight:800; color:var(--acc1); line-height:1;} .big small{font-size:1.8rem; color:#9C92C4;}
.rank{display:inline-block; font-size:1.6rem; font-weight:800; color:#fff; background:linear-gradient(135deg,#FFB03A,#FF8A3D); padding:4px 22px; border-radius:999px; margin:10px 0;}
.meta{font-size:1.15rem; font-weight:700; color:#6E6592;}
.res-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:20px;}
.res-block{background:#FBFAFF; border:2px solid var(--line); border-radius:20px; padding:14px 18px;}
.res-block h4{margin:0 0 10px; font-size:1.2rem; color:var(--acc1);}
.res-block table{width:100%; border-collapse:collapse; font-size:1.05rem;}
.res-block th,.res-block td{padding:7px 8px; border-bottom:1px solid #ECE7FA; text-align:left;}
.res-block th{color:#9C92C4; font-size:.9rem;}
.res-block td.num{text-align:right; font-weight:800;}
.wrong-item{border-left:5px solid var(--bad); background:#fff; border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:1.05rem; line-height:1.5;}
.wrong-item>div:last-child{white-space:pre-line;} .explain{white-space:pre-line;} .wrong-item .h{font-weight:800;} .wrong-item .a{color:#159a5f; font-weight:800;}
.tips li{margin-bottom:6px; font-size:1.1rem;}
.praise{font-size:1.25rem; font-weight:800; color:#159a5f;}
.sr{position:absolute; left:-9999px;}

@media (max-width:1040px){
  main{flex-direction:column; max-width:1060px; align-items:stretch;} #app{width:100%;}
  .qnav{flex:0 0 auto; width:100%; position:static; max-height:none; border-radius:22px; padding:12px;}
  .qnav .grp{margin-bottom:10px;}
  .qnav .cells{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));}
  .qnav .cell{aspect-ratio:auto; min-height:50px;}
  .navtog{display:flex;}
  .qnav:not(.open) .navbody{display:none;}
}
/* màn hình hẹp: logo nằm trên tiêu đề, không đè chữ */
@media (max-width:700px){
  header.topbar{padding-top:62px;}
  .brand{top:10px; transform:none; height:44px;}
  .brand-left{left:12px;} .brand-right{right:12px;}
}
@media (max-width:860px){
  :root{--fs:20px;} .brand{height:56px;} main{padding:0 10px;} .qhead{padding:14px 18px;} .qhead .q-en{font-size:1.2rem;} .qbody{padding:16px 14px 4px;}
  .split,.split.rev,.row-flex{flex-direction:column; align-items:stretch;} .media.side{width:100%; flex:0 0 auto; height:260px;} .media.scene{height:240px;} .ladder,.side-bank{flex:0 0 auto;}
  .opts.g4{grid-template-columns:1fr 1fr;} .opts.g2{grid-template-columns:1fr;} .res-grid{grid-template-columns:1fr;} .fields input{min-width:0; width:100%;}
  .line{flex-wrap:wrap;} .sent{font-size:1.25rem;} .slip{font-size:1.1rem;} table.tf{font-size:1.05rem;} .tfb{width:44px;height:44px;}
}
/* --- dạng câu mới: tư liệu, bảng số liệu, nối có dây, bảng tích, bấm chọn, thẻ lạc nhóm, tia số --- */
.tl-box{border-left:6px solid var(--acc1); background:#F6F3FF; border-radius:18px; padding:12px 18px; margin:0 0 16px; font-weight:600; text-align:left; font-size:1.15rem; line-height:1.5;}
.tl-box b{display:block; color:var(--acc1); margin-bottom:4px;}
.sl-wrap{overflow-x:auto; margin:0 0 18px;}
table.sl{border-collapse:separate; border-spacing:0; margin:0 auto; font-size:1.25rem; font-weight:700; background:#fff; border:3px solid var(--line); border-radius:16px; overflow:hidden;}
table.sl caption{font-weight:800; color:var(--acc1); padding-bottom:8px;}
table.sl th{background:#EEE9FF; color:var(--acc1); padding:8px 16px; border-bottom:2px solid var(--line);}
table.sl td{padding:8px 16px; text-align:center; border-top:2px solid var(--line);}
table.sl th+th, table.sl td+td{border-left:2px solid var(--line);}
.ml{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:14px 76px; margin:0 0 14px;}
.ml-col{display:flex; flex-direction:column; gap:12px;}
.ml-it{position:relative; border:3px solid var(--line); border-radius:18px; padding:12px 18px; background:#FBFAFF; font:inherit; font-weight:800; font-size:1.3rem; color:var(--ink); cursor:pointer; min-height:58px; box-shadow:0 4px 0 #EFEAFF;}
.ml-it:hover:not(:disabled){border-color:#C9BEFF;}
.ml-it.sel{border-color:var(--acc1); background:#F1EDFF; outline:4px solid rgba(124,92,252,.18);}
.ml-it.wrong,.ml-it.bad{border-color:var(--bad); background:#FFECEF;}
.ml-it.ok{border-color:var(--ok); background:#E4FBF0;}
.ml-it:disabled{cursor:default;}
.ml-it .dot{position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid #B9AEE6; transform:translateY(-50%);}
.ml-it.L .dot{right:-11px;} .ml-it.R .dot{left:-11px;}
.ml-svg{position:absolute; inset:0; pointer-events:none; overflow:visible;}
table.tf.tk td.c{width:auto; min-width:64px;}
table.tf.tk th{text-align:center;} table.tf.tk th:first-child{text-align:left;}
.sent.pw{line-height:2.6;}
.cw.miss{border-style:dashed; border-color:var(--ok); color:#159a5f;}
.od-set{border:3px solid var(--line); border-radius:22px; padding:14px 16px; margin:0 0 16px; background:#FBFAFF;}
.od-set.wrong{border-color:var(--bad); background:#FFF6F7;}
.od-h{font-weight:800; color:var(--acc1); margin:2px 0 10px; text-align:left;}
.od-cards{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:14px;}
.od-c{cursor:pointer;}
.opt.od-r{padding:10px 16px; font-size:1.1rem;}
.opt.od-r .key{width:36px; height:36px; font-size:1.05rem;}
.nl-axis{position:relative; height:68px; margin:4px 0 6px;}
.nl-axis::before{content:""; position:absolute; left:0; right:-8px; top:18px; height:4px; background:var(--ink); border-radius:2px;}
.nl-axis::after{content:""; position:absolute; right:-14px; top:11px; border-left:16px solid var(--ink); border-top:9px solid transparent; border-bottom:9px solid transparent;}
.nl-t{position:absolute; top:8px; width:4px; height:24px; background:var(--ink); transform:translateX(-2px); border-radius:2px;}
.nl-m{position:absolute; top:38px; transform:translateX(-50%); font-weight:800; font-size:1.3rem; white-space:nowrap;}
.boxes.nl{grid-template-columns:repeat(var(--n),minmax(0,1fr));}
.boxes.nl .box{min-height:150px;} .boxes.nl .box h5{font-size:1.25rem;}
.stem.ddflow .ddline{display:inline; margin:0;}
@media (max-width:600px){
  .ml{gap:10px 40px;} .ml-it{font-size:1.02rem; padding:10px 10px; min-height:50px;}
  table.sl{font-size:1.02rem;} table.sl th,table.sl td{padding:6px 8px;}
  table.tf.tk td.c{min-width:44px; padding:8px 4px;} table.tf.tk .tfb{width:42px; height:42px;}
  .nl-m{font-size:1.05rem;} .boxes.nl{gap:6px;} .boxes.nl .box{min-height:120px; padding:6px;}
}


/* --- báo cáo kết quả --- */
.rp-form{max-width:560px; margin:0 auto 18px; display:grid; grid-template-columns:2fr 1fr; gap:12px; text-align:left;}
.rp-form label{display:flex; flex-direction:column; gap:6px; font-weight:800; color:var(--acc1); font-size:1.05rem;}
.rp-form input{font:inherit; font-size:1.2rem; font-weight:700; color:var(--ink); padding:12px 16px; border:3px solid var(--line); border-radius:16px; background:#fff; width:100%;}
.rp-form input:focus{outline:none; border-color:var(--acc1);}
.rp-err{grid-column:1/-1; color:#e0384b; font-weight:700; min-height:1.2em; text-align:center;}
.rp-who{font-weight:800; font-size:1.2rem; color:var(--acc1); margin:6px 0 2px;}
.btn-xls{background:linear-gradient(135deg,#2FD07E,#12B27A); color:#fff; box-shadow:0 6px 0 #0E8F5E;}
.rp-status{text-align:center; margin-top:12px; font-weight:700; color:#6b5f8f;}
.rp-status.ok{color:#159a5f;} .rp-status.bad{color:#e0384b;} .rp-status.wait{color:var(--acc1);}
.rp-link{font:inherit; font-weight:800; color:var(--acc1); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;}
@media (max-width:600px){ .rp-form{grid-template-columns:1fr;} }

/* --- thẻ giáo viên --- */
header.topbar{min-height:150px;}
.teacher{position:absolute; left:24px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,.9); border:2px solid #fff; border-radius:20px; padding:10px 16px 10px 10px; box-shadow:0 8px 22px rgba(124,92,252,.15);
  text-align:left; max-width:340px;}
.teacher img{flex:0 0 auto; width:76px; height:76px; border-radius:50%; object-fit:cover; object-position:50% 18%; border:3px solid #fff; box-shadow:0 0 0 3px var(--pink);}
.teacher .tinfo{font-size:.82rem; line-height:1.45; font-weight:600; color:var(--ink);}
.teacher .tinfo b{display:block; font-size:.9rem; font-weight:800; color:var(--violet); margin-bottom:1px;}
.teacher a{color:inherit; text-decoration:none;}
@media (max-width:1180px){
  header.topbar{padding-top:16px; min-height:0;}
  .teacher{position:static; transform:none; margin:0 auto 6px;}
}
@media (max-width:700px){
  header.topbar{padding-top:12px;}
  .teacher img{width:60px; height:60px;}
}

/* ================= v4: pastel + hình nền + menu ngang ================= */
:root{--p1:#DCD3FF; --p2:#CDEBFF; --pdark:#B6A9EF; --acc1:#8A79E6; --acc2:#7CC4F2; --accdark:#7565D6; --pink:#EE88AE; --ok:#4CC28E; --bad:#F07C8B; --line:#EEE9FB;}
body.part-thong-hieu{--p1:#CBF2DE; --p2:#E0F6CB; --pdark:#9DD9BA; --acc1:#3DB582; --acc2:#7BD9A6; --accdark:#2E9C6C;}
body.part-van-dung{--p1:#FFDCCB; --p2:#FFD6E4; --pdark:#F1B4A6; --acc1:#EE8868; --acc2:#F39AB6; --accdark:#D46E7E;}
body, body.part-thong-hieu, body.part-van-dung{background:#FBF8FF url("bg.jpg") center center / cover no-repeat fixed;}
.qhead, .btn-main, .pill.count, .navtog, .mini, .play{background:linear-gradient(135deg,var(--p1),var(--p2)); color:var(--ink);}
.btn-main, .play, .mini{box-shadow:0 6px 0 var(--pdark);}
.pill.count{box-shadow:0 6px 16px rgba(140,120,220,.18);}
.qhead .tag{background:rgba(255,255,255,.65); color:var(--ink);}
.btn-next{background:linear-gradient(135deg,#CBF2DE,#B7EBD1); color:#1E6A49; box-shadow:0 6px 0 #95D4B5;}
.btn-end{background:linear-gradient(135deg,#FFD9E0,#FFC7D1); color:#A23A4D; box-shadow:0 6px 0 #EFA5B2;}
.btn-xls{background:linear-gradient(135deg,#D6F5E5,#C0ECD5); color:#1E6A49; box-shadow:0 6px 0 #9DD7B9;}
.rank{background:linear-gradient(135deg,#FFE6B8,#FFD3BC); color:#8A4A12;}
.prog i{background:linear-gradient(90deg,var(--p1),var(--pdark));}
.statusbar{background:rgba(255,255,255,.78);}
.qcard{box-shadow:0 14px 36px rgba(120,100,190,.12);}
/* tên bài to hơn */
.topbar h1{font-size:2.7rem; line-height:1.2;}
.topbar p{font-size:1.3rem; color:#D2668F;}
header.topbar{background:rgba(255,255,255,.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); border-bottom:2px solid rgba(255,255,255,.8);}
@media (max-width:700px){ .topbar h1{font-size:1.9rem;} .topbar p{font-size:1.08rem;} }
/* danh sách câu: hàng ngang phía trên khung nội dung, dưới thanh tiến trình */
main{flex-direction:column; align-items:stretch; max-width:1240px;}
.qnav{flex:0 0 auto; width:100%; position:static; max-height:none; overflow:visible; padding:12px 14px; border-radius:22px; background:rgba(255,255,255,.9);}
.qnav .navtog{display:none !important;}
.qnav .navbody, .qnav:not(.open) .navbody{display:flex !important; gap:12px; margin-top:0;}
.qnav .grp{flex:1 1 0; min-width:0; margin:0;}
.qnav .grp-h{padding:7px 12px; margin-bottom:8px; font-size:.98rem;}
.qnav .grp.on .grp-h{color:var(--ink);}
.qnav .cells{grid-template-columns:repeat(6,1fr); gap:6px;}
.qnav .cell{aspect-ratio:auto; min-height:44px; border-radius:12px; font-size:1.08rem;}
.qnav .cell.now{background:#FFE68F; border-color:#F2C94C; color:#6B4E00; box-shadow:0 3px 0 #F2D47A;}
.qnav .g-nhan-biet{--pc1:#DCD3FF; --pc2:#CDEBFF; --pc:#6E5ED6;}
.qnav .g-thong-hieu{--pc1:#CBF2DE; --pc2:#E0F6CB; --pc:#2E8F63;}
.qnav .g-van-dung{--pc1:#FFDCCB; --pc2:#FFD6E4; --pc:#C4566B;}
@media (max-width:760px){ .qnav .navbody, .qnav:not(.open) .navbody{flex-direction:column; gap:10px;} }
/* --- v4.1: tên bài không bị thẻ giáo viên che --- */
@media (min-width:1181px){
  header.topbar{padding-left:384px; padding-right:clamp(24px, calc(100vw - 1500px), 384px);}
}

/* --- v4.2: giữ khung hình ở nội dung bài --- */
#app{min-height:100vh; overflow-x:clip;}   /* luôn đủ chỗ cuộn tới phần nội dung (kể cả câu ngắn); hiệu ứng trượt không làm trang rộng ra trên điện thoại */
@media (max-height:900px){   /* màn hình thấp (laptop 768px, điện thoại): gọn khung câu để thấy trọn câu + nút */
  .qcard{padding-bottom:14px;}
  .qhead{padding-top:10px; padding-bottom:10px;}
  .qbody{padding-top:14px;}
  .stem{margin-bottom:12px;}
  .opts{gap:10px;} .opt{padding-top:8px; padding-bottom:8px;} .opt .key{width:38px; height:38px;}
  .actions{margin-top:8px;} .btn{padding-top:10px; padding-bottom:10px;}
  .fb{margin-top:10px; padding-top:8px; padding-bottom:8px;} .explain{margin-top:8px; padding-top:10px; padding-bottom:10px;}
  .tf{border-spacing:0 6px;} .tf td{padding-top:6px; padding-bottom:6px;}
  .lines{gap:8px;} .line .txt{line-height:1.7;}
  .bank{padding:10px; margin-bottom:12px; min-height:60px;}
}
@media (max-width:760px) and (max-height:900px){
  .card{font-size:1.25rem; padding:6px 16px;} .bank{gap:8px;} .note{margin-top:6px; font-size:.95rem;}
  .qhead{padding-top:8px; padding-bottom:8px;} .qbody{padding-top:10px;}
}
@media (min-width:761px) and (max-height:900px){
  main{margin-top:10px; gap:10px;}
  .qnav{padding:8px 12px;} .qnav .grp-h{padding:4px 12px; margin-bottom:6px;} .qnav .cell{min-height:38px;}
}
@media (min-width:900px) and (max-height:900px){   /* 4 phương án chữ xếp 2 cột */
  .opts:not(.g2):not(.g4):not(.long){display:grid; grid-template-columns:1fr 1fr;}
}
/* ================= v5: thanh tiêu đề câu tô đậm chứa đề bài (theo mẫu) ================= */
.qhead.qh5{background:linear-gradient(135deg,#27358F,#2F67D0); color:#fff; border-bottom:5px solid #FFC942; padding:16px 30px 18px;}
.qhead.qh5 .tag{background:rgba(255,255,255,.14); color:#E8EEFF; border:1px solid rgba(255,255,255,.35); text-transform:uppercase; font-size:.76rem; letter-spacing:.07em; padding:3px 12px; margin:0 0 10px;}
.qh5 .q-title{font-size:calc(var(--fs) + 2px); font-weight:800; line-height:1.5; white-space:pre-line; text-align:left;}
.qh5 .qno{color:#FFD54A;}
.qh5 .gap{border-bottom-color:rgba(255,255,255,.85); min-width:90px;}
.qh5 .frac>.fd{border-top-color:#fff;}
@media (max-width:700px){ .qhead.qh5{padding:12px 16px 14px;} .qh5 .q-title{font-size:1.08rem;} .qhead.qh5 .tag{font-size:.68rem;} }

/* Toán 3: quay kim đồng hồ, tô ô */
.ck-wrap{user-select:none; -webkit-user-select:none; display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap; margin:6px 0 10px;}
.ck-main{border:4px solid transparent; border-radius:50%; padding:4px; line-height:0;}
.ck-main.wrong,.ck-main.bad{border-color:var(--bad);} .ck-main.ok{border-color:var(--ok);}
.ck-svg{max-width:100%; height:auto; touch-action:none; user-select:none;} .ck-svg .nam{cursor:grab;}
.ck-dap{text-align:center;} .ck-cap{font-weight:800; color:#159a5f; margin-bottom:4px;}
.ck-btns{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin:4px 0;}
.ck-l{font-weight:800; margin-left:10px; display:inline-flex; align-items:center; gap:6px;}
.ck-b{min-width:52px; padding:8px 14px; font-size:20px;}
.dot-p,.dot-g{display:inline-block; width:16px; height:6px; border-radius:3px;} .dot-p{background:#2E6BD6;} .dot-g{background:#E2563A;}
.sg-wrap{display:flex; justify-content:center; margin:8px 0 10px; padding:8px; border:4px solid transparent; border-radius:16px;}
.sg-wrap.wrong,.sg-wrap.bad{border-color:var(--bad);} .sg-wrap.ok{border-color:var(--ok);}
.sg-svg{max-width:100%; height:auto;} .sg-svg [data-act=sg]{cursor:pointer;} .sg-svg [data-act=sg]:hover{opacity:.85;}
.sg-svg [data-act=sg]:focus{outline:none; stroke:var(--violet); stroke-width:4;}

/* ===== Vật lí 10: kí hiệu góc, ô điền trong phân số, bấm vùng trên hình ===== */
.goc{position:relative; display:inline-block; padding-top:.18em; line-height:1.1; white-space:nowrap;}
.vec{position:relative; display:inline-block; padding-top:.34em; line-height:1.1; white-space:nowrap;}
.vec::before{content:""; position:absolute; left:.04em; right:.2em; top:.14em; border-top:.08em solid currentColor;}
.vec::after{content:""; position:absolute; right:0; top:.02em; border-left:.34em solid currentColor; border-top:.16em solid transparent; border-bottom:.16em solid transparent;}
.goc::before{content:''; position:absolute; left:.04em; right:.04em; top:0; height:.34em;

.frac .numin{width:3.4em; min-width:0; padding:4px 2px; margin:2px 0; text-align:center;}
.frac .fn .numin{margin-bottom:4px;}
.pr-wrap{position:relative; width:100%; max-width:720px; margin:0 auto 10px; border-radius:20px; overflow:hidden; background:#fff;}
.pr-wrap img{position:absolute; inset:0; width:100%; height:100%; display:block;}
.pr-wrap svg{position:absolute; inset:0; width:100%; height:100%;}
.pr-wrap .pr{fill:rgba(255,200,61,0); stroke:rgba(46,107,214,0); stroke-width:4; cursor:pointer; transition:fill .15s;}
.pr-wrap .pr:hover,.pr-wrap .pr:focus{fill:rgba(255,200,61,.28); stroke:rgba(46,107,214,.55); outline:none;}
.pr-wrap .pr.sel{fill:rgba(255,170,40,.45); stroke:#E08A00;}
.pr-wrap .pr.ok{fill:rgba(46,180,90,.40); stroke:#1E8C46;}
.pr-wrap .pr.bad{fill:rgba(230,70,70,.38); stroke:#C0392B;}
.pr-wrap.locked .pr{cursor:default;}
.pr-wrap.wrong{box-shadow:0 0 0 3px #FF8A8A;}
.pr-chon{text-align:center; font-weight:700; color:#2B2D42; margin:4px 0 0;}
/* === VÁ GĐ2 12/11/2026 === */
.opts.gon{display:grid; width:fit-content; max-width:100%; margin:0 auto; grid-template-columns:repeat(var(--cot,3),minmax(150px,1fr))!important; gap:12px 16px;}
.opts.gon .opt{width:auto; padding:10px 18px; gap:12px;}
.opts.gon .opt .key{width:38px; height:38px; font-size:1.1rem; border-radius:12px;}
.dfsplit{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:24px; align-items:center; margin-bottom:18px;}
.media.dfimg{width:100%; height:auto; background:transparent;}
.media.dfimg img{height:auto; max-height:480px;}
.dfsplit .lines{gap:12px;}
.line .txt.day{display:flex; align-items:center; gap:10px; width:100%;}
.line .slot.day{flex:1 1 auto; min-width:0; margin:0; justify-content:flex-start; text-align:left; padding:6px 14px;}
.slot.so{position:relative;}
.slot .slno{position:absolute; top:4px; left:8px; font-size:.72rem; font-weight:700; color:#D4CDEE; line-height:1;}
.slot.filled .slno,.slot.ok .slno,.slot.wrong .slno{color:rgba(0,0,0,.2);}
.ml-it.R.sel{border-color:var(--acc1); background:#F1EDFF; outline:4px solid rgba(124,92,252,.18);}
@media (max-width:860px){ .opts.gon{width:100%; grid-template-columns:repeat(2,minmax(0,1fr))!important; gap:10px;} .opts.gon .opt{width:100%; padding:8px 10px; gap:8px; font-size:1.05rem;}
  .opts.gon .opt .key{width:30px; height:30px; font-size:.95rem; border-radius:10px;} .dfsplit{grid-template-columns:1fr; gap:6px;} .dfzoom{display:block!important;} }
.dfzoom{display:none; margin:0 0 8px; text-align:center;}
/* === T12 kéo thả 2 vùng song song === */
.dfsplit.dfdoi{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center;}
.dfsplit.dfdoi .bank{margin:0; min-height:100%; align-content:center;}
@media (max-width:860px){ .dfsplit.dfdoi{grid-template-columns:1fr; gap:14px;} }
