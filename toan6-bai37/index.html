<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Dùng thử] Toán 6 – Bài 37. Số đo góc</title>
<style>
:root{ --pink:#FF5D8F; --violet:#7C5CFC; --sun:#FFC942; --orange:#FF8A3D; --ink:#3A2E5C; --ok:#22B573; --bad:#FF5A6E; --line:#EDE7FF;
  --fs:24px; --acc1:#6C5CE7; --acc2:#3AB0FF; --accdark:#4A3EC0; }
body.part-van-dung{--acc1:#FF7A45;--acc2:#FF5D8F;--accdark:#D9466E;}
body.part-thong-hieu{--acc1:#12B27A;--acc2:#2FD07E;--accdark:#0E8F5E;}
*{box-sizing:border-box;}
body{margin:0; color:var(--ink); font-size:18px; padding-bottom:40px;
  font-family:'Baloo 2','Segoe UI Rounded','SF Pro Rounded','Nunito','Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif;
  background:radial-gradient(1200px 520px at 12% -6%,#FFE1EC 0%,transparent 60%),radial-gradient(1000px 520px at 100% 0%,#DDF3FF 0%,transparent 55%),linear-gradient(160deg,#FFF7EC 0%,#F1ECFF 55%,#E7FBF1 100%); background-attachment:fixed;}
body.part-thong-hieu{background:radial-gradient(1200px 520px at 12% -6%,#DBF7E6 0%,transparent 60%),radial-gradient(1000px 520px at 100% 0%,#DAF6EE 0%,transparent 55%),linear-gradient(160deg,#EAFBF0 0%,#E6F7ED 55%,#F1FBE8 100%); background-attachment:fixed;}
body.part-van-dung{background:radial-gradient(1200px 520px at 12% -6%,#FFE3D6 0%,transparent 60%),radial-gradient(1000px 520px at 100% 0%,#FFE1EC 0%,transparent 55%),linear-gradient(160deg,#FFF4EC 0%,#FFEFF3 55%,#FFF8E6 100%); background-attachment:fixed;}
button{font-family:inherit; color:inherit;}
u{text-decoration-thickness:3px; text-underline-offset:4px;}

header.topbar{position:relative; text-align:center; padding:16px 16px 6px; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.topbar .badge{display:inline-block; background:#fff; border-radius:999px; padding:6px 20px; box-shadow:0 8px 22px rgba(124,92,252,.18); font-weight:800; color:var(--violet);}
.topbar h1{margin:10px 0 2px; font-size:1.9rem;}
.topbar p{margin:0; font-weight:700; color:var(--pink);}
.brand{position:absolute; top:50%; transform:translateY(-50%); height:96px; max-width:180px; object-fit:contain;}
.brand-left{left:28px;} .brand-right{right:28px;}

.statusbar{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.88); backdrop-filter:blur(8px); border-bottom:2px solid #fff; padding:10px 18px; display:flex; align-items:center; gap:14px;}
.prog{flex:1; height:14px; background:#EFEAFF; border-radius:999px; overflow:hidden;}
.prog i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc1),var(--acc2)); border-radius:999px; transition:width .4s;}
.pill{flex:0 0 auto; font-weight:800; padding:6px 16px; border-radius:999px; white-space:nowrap; font-size:1.05rem;}
.pill.count{background:linear-gradient(135deg,var(--acc1),var(--acc2)); color:#fff; box-shadow:0 6px 16px rgba(124,92,252,.3);}
.pill.time{background:#fff; border:2px solid var(--line); color:var(--acc1); font-variant-numeric:tabular-nums;}
.pill.time.low{background:#FFECEF; border-color:#FFB3BF; color:#e0384b; animation:pulse 1s infinite;}

main{max-width:1330px; margin:16px auto; padding:0 20px; display:flex; gap:18px; align-items:flex-start;}
#app{flex:1 1 0; min-width:0;}

/* ===== bảng câu hỏi (cột trái) ===== */
.qnav:empty{display:none;}
.qnav{flex:0 0 236px; background:#fff; border-radius:28px; border:3px solid #fff; box-shadow:0 16px 40px rgba(90,70,160,.14);
  padding:14px; position:sticky; top:58px; max-height:calc(100vh - 76px); overflow:auto;}
.qnav .grp{margin-bottom:14px;} .qnav .grp:last-child{margin-bottom:0;}
.qnav .grp-h{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#F1EEF9; color:var(--pc);
  border-radius:16px; padding:9px 13px; font-weight:800; font-size:1rem; line-height:1.25; margin-bottom:10px;}
.qnav .grp.on .grp-h{background:linear-gradient(135deg,var(--pc1),var(--pc2)); color:#fff;}
